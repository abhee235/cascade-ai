<svg width="24" height="24" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- The cascade bars mark. Activity-bar icons are theme-masked, so currentColor with
       stepped opacity (alpha carries the fade) instead of the site's gradient. -->
  <rect x="3" y="3" width="7" height="19" rx="3.5" fill="currentColor"/>
  <rect x="12.5" y="8" width="7" height="19" rx="3.5" fill="currentColor" opacity="0.75"/>
  <rect x="22" y="13" width="7" height="16" rx="3.5" fill="currentColor" opacity="0.5"/>
</svg>
